<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZDSM 十二宫系统图</title>
<style>
:root{--bg:#0e1116;--panel:#151a22;--text:#edf1f7;--muted:#9ba7b4;--line:#546171;--accent:#d7dde7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{padding:24px 28px 8px}
h1{font-size:24px;margin:0 0 8px}
.sub{color:var(--muted);font-size:14px}
.wrap{display:grid;grid-template-columns:minmax(620px,1.6fr) minmax(320px,.7fr);gap:18px;padding:18px}
.card{background:var(--panel);border:1px solid #27303b;border-radius:16px;overflow:hidden}
#graph{width:100%;height:760px;display:block}
.side{padding:20px}
.node{cursor:pointer}
.node circle{fill:#1e2631;stroke:#758295;stroke-width:1.5}
.node.active circle{stroke-width:4}
.node.core circle{stroke:#e5e9ef;stroke-width:3}
.node text{fill:var(--text);text-anchor:middle;pointer-events:none}
.node .small{fill:var(--muted);font-size:11px}
.edge{fill:none;stroke:var(--line);stroke-width:1;opacity:.5}
.edge.functional{stroke-dasharray:6 5;opacity:.45}
.edge.opposite{stroke-width:2;opacity:.65}
.edge.self_transform{stroke-dasharray:2 4}
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:0 28px 18px;color:var(--muted);font-size:12px}
.badge{padding:4px 8px;border:1px solid #394454;border-radius:999px}
#detail h2{margin-top:0}
#detail .tag{display:inline-block;border:1px solid #465466;border-radius:999px;padding:3px 8px;margin:2px;font-size:12px}
#detail ul{padding-left:20px}
.contact{margin:0 18px 18px;padding:18px;background:var(--panel);border:1px solid #27303b;border-radius:16px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}#graph{height:620px}}
</style>
</head>
<body>
<header>
<h1>ZDSM 十二宫系统图</h1>
<div class="sub" id="subtitle"></div>
</header>
<div class="legend">
<span class="badge">实线：传统三合/对宫</span>
<span class="badge">虚线：ZDSM 功能链</span>
<span class="badge">粗边节点：本盘关键节点</span>
<span class="badge">高亮：当前时间层激活</span>
</div>
<div class="wrap">
<div class="card"><svg id="graph" viewBox="0 0 900 760"></svg></div>
<div class="card side" id="detail"><h2>点击任一宫位</h2><p class="sub">查看主星、系统角色、节点标签和当前激活层。</p></div>
</div>
<div class="contact" id="contact"></div>
<script>

", "state": "陷"}], "system_tags": ["价值捕获瓶颈"], "activation_layers": [], "claim_refs": ["CLM-b358bda963", "CLM-3ea8e46bdc"]}, {"id": "子女宫", "palace": "子女宫", "branch": "午", "stem_branch": "丙午", "role": "生成与输出", "stars": [{"name": "巨门", "state": "旺", "natal_transformation": "生年忌"}], "aux_stars": [{"name": "禄存", "state": "庙"}, {"name": "铃星", "state": "庙"}], "system_tags": ["输出接口", "反馈摩擦节点"], "activation_layers": ["流年"], "claim_refs": ["CLM-c92539e730", "CLM-aa06a9fa25"]}, {"id": "夫妻宫", "palace": "夫妻宫", "branch": "未", "stem_branch": "丁未", "role": "双人绑定/合作接口", "stars": [{"name": "天相", "state": "得地"}], "aux_stars": [{"name": "左辅", "state": "庙"}, {"name": "右弼", "state": "庙"}, {"name": "擎羊", "state": "庙"}, {"name": "地劫", "state": "平"}], "system_tags": [], "activation_layers": ["流月", "流日"], "claim_refs": ["CLM-ba4d28cefa"]}, {"id": "兄弟宫", "palace": "兄弟宫", "branch": "申", "stem_branch": "戊申", "role": "横向近关系/同辈协作", "stars": [{"name": "天同", "state": "旺", "natal_transformation": "生年权"}, {"name": "天梁", "state": "陷", "self_transform": "↑禄"}], "aux_stars": [], "system_tags": [], "activation_layers": [], "claim_refs": ["CLM-f26ea2f1be"]}, {"id": "命宫", "palace": "命宫", "branch": "酉", "stem_branch": "己酉", "role": "核心自我调节", "stars": [{"name": "武曲", "state": "利", "self_transform": "↓禄"}, {"name": "七杀", "state": "旺"}], "aux_stars": [{"name": "天钺", "state": "庙"}], "system_tags": ["发动机", "执行节点"], "activation_layers": [], "claim_refs": ["CLM-b37743986c"]}, {"id": "父母宫", "palace": "父母宫", "branch": "戌", "stem_branch": "庚戌", "role": "纵向权威与制度接口", "stars": [{"name": "太阳", "state": "不", "self_transform": "↓禄;↑忌"}], "aux_stars": [], "system_tags": [], "activation_layers": [], "claim_refs": ["CLM-29af033a78", "CLM-3ea8e46bdc"]}, {"id": "福德宫", "palace": "福德宫", "branch": "亥", "stem_branch": "辛亥", "role": "内部奖赏与恢复", "stars": [], "aux_stars": [{"name": "天魁", "state": "旺"}, {"name": "火星", "state": "利"}], "system_tags": [], "activation_layers": ["大限"], "claim_refs": ["CLM-338521a60a"]}], "edges": [{"source": "命宫", "target": "官禄宫", "edge_type": "trine", "label": "三合", "layers": ["natal"], "evidence_type": "T"}, {"source": "命宫", "target": "财帛宫", "edge_type": "trine", "label": "三合", "layers": ["natal"], "evidence_type": "T"}, {"source": "命宫", "target": "迁移宫", "edge_type": "opposite", "label": "对宫", "layers": ["natal"], "evidence_type": "T"}, {"source": "兄弟宫", "target": "田宅宫", "edge_type": "trine", "label": "三合", "layers": ["natal"], "evidence_type": "T"}, {"source": "兄弟宫", "target": "疾厄宫", "edge_type": "trine", "label": "三合", "layers": ["natal"], "evidence_type": "T"}, {"source": "兄弟宫", "target": "交友宫", "edge_type": "opposite", "label": "对宫", "layers": ["natal"], "evidence_type": "T"}, {"source": "夫妻宫", "target": "福德宫", "edge_type": "trine", "label": "三合", "layers": ["natal"], "evidence_type": "T"}, {"source": "夫妻宫", "target": "迁移宫", "edge_type": "trine", "label": "三合", "layers": ["natal"], "evidence_type": "T"}, {"source": "夫妻宫", "target": "官禄宫", "edge_type": "opposite", "label": "对宫", "layers": ["natal"], "evidence_type": "T"}, {"source": "子女宫", "target": "父母宫", "edge_type": "trine", "label": "三合", "layers": ["natal"], "evidence_type": "T"}, {"source": "子女宫", "target": "交友宫", "edge_type": "trine", "label": "三合", "layers": ["natal"], "evidence_type": "T"}, {"source": "子女宫", "target": "田宅宫", "edge_type": "opposite", "label": "对宫", "layers": ["natal"], "evidence_type": "T"}, {"source": "命宫", "target": "官禄宫", "edge_type": "functional", "label": "执行/选择 → 生产角色", "layers": ["natal"], "evidence_type": "M"}, {"source": "官禄宫", "target": "财帛宫", "edge_type": "functional", "label": "成果 → 价值交换", "layers": ["natal"], "evidence_type": "M"}, {"source": "财帛宫", "target": "田宅宫", "edge_type": "functional", "label": "现金/资源 → 长期存量", "layers": ["natal"], "evidence_type": "M"}, {"source": "官禄宫", "target": "子女宫", "edge_type": "functional", "label": "项目/问题 → 输出/作品", "layers": ["natal"], "evidence_type": "M"}, {"source": "子女宫", "target": "田宅宫", "edge_type": "functional", "label": "输出 → 沉淀资产", "layers": ["natal"], "evidence_type": "M"}, {"source": "交友宫", "target": "官禄宫", "edge_type": "functional", "label": "信息/引荐 → 工作机会", "layers": ["natal"], "evidence_type": "M"}, {"source": "迁移宫", "target": "官禄宫", "edge_type": "functional", "label": "外部环境 → 职业反馈", "layers": ["natal"], "evidence_type": "M"}, {"source": "父母宫", "target": "官禄宫", "edge_type": "functional", "label": "规则/资格 → 职业角色", "layers": ["natal"], "evidence_type": "M"}, {"source": "官禄宫", "target": "福德宫", "edge_type": "functional", "label": "工作负荷 → 内在消耗", "layers": ["natal"], "evidence_type": "M"}, {"source": "福德宫", "target": "疾厄宫", "edge_type": "functional", "label": "精神负荷 → 恢复系统", "layers": ["natal"], "evidence_type": "M"}, {"source": "疾厄宫", "target": "命宫", "edge_type": "functional", "label": "恢复状态 → 行动能力", "layers": ["natal"], "evidence_type": "M"}, {"source": "福德宫", "target": "夫妻宫", "edge_type": "functional", "label": "内在稳定 → 关系承接", "layers": ["natal"], "evidence_type": "M"}, {"source": "交友宫", "target": "夫妻宫", "edge_type": "functional", "label": "社群 → 关系/合作入口", "layers": ["natal"], "evidence_type": "M"}, {"source": "夫妻宫", "target": "财帛宫", "edge_type": "functional", "label": "绑定关系 → 成本/资源交换", "layers": ["natal"], "evidence_type": "M"}, {"source": "田宅宫", "target": "田宅宫", "edge_type": "self_transform", "label": "天机 ↑权", "layers": ["natal"], "evidence_type": "S"}, {"source": "官禄宫", "target": "官禄宫", "edge_type": "self_transform", "label": "破军 ↓禄", "layers": ["natal"], "evidence_type": "S"}, {"source": "疾厄宫", "target": "疾厄宫", "edge_type": "self_transform", "label": "太阴 ↑科", "layers": ["natal"], "evidence_type": "S"}, {"source": "兄弟宫", "target": "兄弟宫", "edge_type": "self_transform", "label": "天梁 ↑禄", "layers": ["natal"], "evidence_type": "S"}, {"source": "命宫", "target": "命宫", "edge_type": "self_transform", "label": "武曲 ↓禄", "layers": ["natal"], "evidence_type": "S"}, {"source": "父母宫", "target": "父母宫", "edge_type": "self_transform", "label": "太阳 ↓禄;↑忌", "layers": ["natal"], "evidence_type": "S"}], "active_layers": {"福德宫": ["大限"], "交友宫": ["小限"], "子女宫": ["流年"], "夫妻宫": ["流月", "流日"], "田宅宫": ["流时"]}, "legend": {"node_tags": {"发动机": "核心行动与决策来源", "中央处理器": "统筹、职业与高阶重构节点", "价值捕获瓶颈": "价值交换/留存需要重点优化", "长期资产节点": "知识、作品、流程、存量资产", "输出接口": "作品、表达、教学、受众", "恢复节点": "负荷与恢复"}, "edge_types": {"trine": "传统三合", "opposite": "传统对宫", "functional": "ZDSM现代功能链", "self_transform": "流派特定自化"}}};
const CONTACT={"mode": "human_only", "show_contact_after_report": true, "contact_title": "对报告还有疑问？", "contact_text": "如果你希望结合现实经历进一步核对，可以联系人工解读。", "channels": [{"type": "wechat", "label": "微信", "value": "请在部署时填写"}, {"type": "email", "label": "邮箱", "value": "请在部署时填写"}], "ai_api_enabled": false};
document.getElementById("subtitle").textContent=(DATA.meta.profile?.solar_datetime||"")+" · "+(DATA.meta.profile?.lunar_datetime||"");
const svg=document.getElementById("graph");
const NS="http://www.w3.org/2000/svg";
const cx=450, cy=375, rx=330, ry=280;
const nodes={};
const n=DATA.nodes.length;
DATA.nodes.forEach((d,i)=>{
  const ang=(-Math.PI/2)+(i*2*Math.PI/n);
  nodes[d.id]={x:cx+rx*Math.cos(ang),y:cy+ry*Math.sin(ang),d};
});
function el(tag,attrs={}){
  const e=document.createElementNS(NS,tag);
  Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
  return e;
}
function edgePath(a,b,curved=false){
  if(!curved) return `M ${a.x} ${a.y} L ${b.x} ${b.y}`;
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  const dx=b.x-a.x,dy=b.y-a.y;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  const ox=-dy/len*28, oy=dx/len*28;
  return `M ${a.x} ${a.y} Q ${mx+ox} ${my+oy} ${b.x} ${b.y}`;
}
DATA.edges.forEach((e,idx)=>{
  const a=nodes[e.source],b=nodes[e.target];
  if(!a||!b)return;
  if(e.source===e.target)return;
  const p=el("path",{d:edgePath(a,b,e.edge_type==="functional"),class:`edge ${e.edge_type}`});
  const title=el("title"); title.textContent=`${e.label} · ${e.evidence_type}`; p.appendChild(title);
  svg.appendChild(p);
});
DATA.nodes.forEach((d,i)=>{
  const p=nodes[d.id];
  const g=el("g",{class:"node"+(d.activation_layers.length?" active":"")+(d.system_tags.length?" core":"")});
  const c=el("circle",{cx:p.x,cy:p.y,r:62});
  g.appendChild(c);
  const t=el("text",{x:p.x,y:p.y-12,"font-size":"16","font-weight":"700"});
  t.textContent=d.palace; g.appendChild(t);
  const b=el("text",{x:p.x,y:p.y+8,class:"small"}); b.textContent=d.stem_branch||d.branch; g.appendChild(b);
  const s=el("text",{x:p.x,y:p.y+27,class:"small"});
  s.textContent=(d.stars||[]).map(x=>x.name+(x.state?`(${x.state})`:"")).join(" / ")||"空宫"; g.appendChild(s);
  if(d.activation_layers.length){
    const a=el("text",{x:p.x,y:p.y+46,class:"small"}); a.textContent=d.activation_layers.join(" · "); g.appendChild(a);
  }
  g.addEventListener("click",()=>show(d));
  svg.appendChild(g);
});
function show(d){
  const tags=d.system_tags.map(x=>`<span class="tag">${x}</span>`).join("");
  const stars=(d.stars||[]).map(x=>`<li>${x.name}${x.state?` · ${x.state}`:""}${x.natal_transformation?` · ${x.natal_transformation}`:""}${x.self_transform?` · ${x.self_transform}`:""}</li>`).join("");
  const aux=(d.aux_stars||[]).map(x=>`<li>${x.name}${x.state?` · ${x.state}`:""}</li>`).join("");
  document.getElementById("detail").innerHTML=`
    <h2>${d.palace} · ${d.stem_branch||d.branch}</h2>
    <p>${d.role}</p>
    <div>${tags||'<span class="sub">无特殊系统标签</span>'}</div>
    <h3>主星</h3><ul>${stars||"<li>空宫</li>"}</ul>
    <h3>重要辅星</h3><ul>${aux||"<li>无</li>"}</ul>
    <h3>当前激活</h3><p>${d.activation_layers.join("、")||"无短周期直接激活"}</p>
    <h3>关联结论</h3><p class="sub">${d.claim_refs.length?d.claim_refs.join("<br>"):"暂无"}</p>
  `;
}
const c=document.getElementById("contact");
c.innerHTML=`<strong>${CONTACT.contact_title}</strong><p>${CONTACT.contact_text}</p>`+
CONTACT.channels.map(x=>`<div>${x.label}：${x.value}</div>`).join("");
</script>
